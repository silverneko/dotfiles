# <prefix> = Ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Index starts from 1 (not 0)
set -g base-index 1
set -g pane-base-index 1

# Enable mouse
set -g mouse on

# Terminal shenanigans... I don't know what these actually do.
set -s escape-time 5
set -g xterm-keys on
set -sg default-terminal "tmux-256color"
set -sa terminal-overrides ",*256col*:Tc"
set -sa terminal-features ",*:RGB:clipboard:sixel"
# Send xterm focus events to vim.
set -g focus-events on
set -g allow-passthrough on

# Cursor color workaround for WezTerm stable build 20240203-110809-5046fc22
# %if "#{>=:#{version},3.6}"
#   set -sa terminal-overrides ",*:Cr=\e]12;silver\a"
#   set -g prompt-cursor-colour 'gray50'
# %endif

# Auto switch to previous/another session on exit.
set -g detach-on-destroy off
# Increase scrollback buffer size
set -g history-limit 100000
# Messages are displayed for 2 seconds
set -g display-time 2000
# Refresh status line interval
set -g status-interval 3
set -g status-keys emacs

# Pane border appearances.
set -g pane-border-lines double
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
set -g pane-border-format " #{?pane_active,#[fg=green]}#{pane_index}: #{pane_current_command} [#{s|^$HOME|~|:pane_current_path}] "
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' [#I:#W#F] '
set -g window-status-separator '|'
set -g window-status-current-style reverse

# Vim style visual mode
set -s set-clipboard external
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X rectangle-off \; send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-on \; send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{scroll_position}" "send-keys -X copy-pipe-no-clear" "send-keys -X copy-pipe-and-cancel"
bind-key -T copy-mode-vi / command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward-incremental "%%" }
bind-key -T copy-mode-vi ? command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental "%%" }
bind-key V copy-mode \; send-key V
bind-key / copy-mode \; send-key /

# Use this if OSC 52 is not supported
# set -s set-clipboard off
# if-shell "command -v xsel >/dev/null 2>&1" "set -s copy-command 'xsel -i --clipboard'" "set -s copy-command 'xclip -selection clipboard'"

# Smoother mouse scrolling
# Stop the five lines per scroll nonsense...
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X scroll-down

# Assign newly created sessions smallest possible number.
set-hook -g session-created "run-shell '~/.dotfiles/tmux_renumber_session.sh \"#S\"'"

# Clear SSH_TTY so we don't show the hostname in PS1.
set-environment -gr "SSH_TTY"

#
# Custom shortcuts
#
# <prefix>+{arrows,hjkl} to select pane
bind-key Up     select-pane -U
bind-key Down   select-pane -D
bind-key Left   select-pane -L
bind-key Right  select-pane -R
# Alt-q           jump to last pane (-Z preserve zoom)
# Ctrl-Alt-q      jump to last window
bind-key -n M-q   if-shell -F "#{>:#{window_panes},1}", "last-pane -Z"
bind-key -n C-M-q if-shell -F "#{>:#{session_windows},1}", "last-window"
# Alt-[           jump to previous pane (-Z preserve zoom)
# Alt-]           jump to next pane
bind-key -n M-[   select-pane -Z -t :.-1
bind-key -n M-]   select-pane -Z -t :.+1
# Alt-{←,→,1-9}   jump to windows
bind-key -n M-Left  if-shell -F "#{>:#{session_windows},1}", previous-window
bind-key -n M-Right if-shell -F "#{>:#{session_windows},1}", next-window
bind-key -n M-1   select-window -t :=1
bind-key -n M-2   select-window -t :=2
bind-key -n M-3   select-window -t :=3
bind-key -n M-4   select-window -t :=4
bind-key -n M-5   select-window -t :=5
bind-key -n M-6   select-window -t :=6
bind-key -n M-7   select-window -t :=7
bind-key -n M-8   select-window -t :=8
bind-key -n M-9   select-window -t :=9

# tmux-prefix-highlight options
set -g @prefix_highlight_bg 'magenta'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_empty_prompt     '      '
set -g @prefix_highlight_prefix_prompt    ' ^A '
set -g status-left '#{p6:#{prefix_highlight}} [#S] '
set -g status-left-length 20
set -g status-right " ${USER} @ #{?#{>:#{window_width},180},#H,#h} | %a %Y-%m-%d %H:%M"
set -g status-right-length 100

# <Prefix>-<CTRL-F> launches tmux-fzf
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 80% -h 80% -m --preview-window=up,70%,follow"

# <Prefix>-f launches extrakto to filter buffer text with fzf
set -g @extrakto_key 'f'
set -g @extrakto_insert_key 'enter'
set -g @extrakto_copy_key 'ctrl-y'
set -g @extrakto_fzf_header 'c o e f g m h'  # 'i c o e f g m h'
set -g @extrakto_clip_mode 'tmux_osc52'
set -g @extrakto_clip_mode_order 'tmux_osc52 buffer'
set -g @extrakto_grab_area 'recent'
set -g @extrakto_history_limit '5000'  # affects how far we look back, default is 2000
set -g @extrakto_fzf_unset_default_opts 'false'
set -g @extrakto_popup_size '80%'

# The icon of thinking...
TMUX_NERD_FONT_USER_CONFIG="~/.dotfiles/tmux_icons.yml"

# tmux-better-mouse-mode
set -g @scroll-in-moused-over-pane 'off'
set -g @scroll-speed-num-lines-per-scroll '1'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# Tmux Plugin Manager
#   $ git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# <prefix> + I to fetch plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'silverneko/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'jaclu/tmux-menus'

# Keep this at the very bottom
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run -b '~/.tmux/plugins/tpm/tpm'
