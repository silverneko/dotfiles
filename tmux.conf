# <prefix> = Ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Index starts from 1 (not 0)
set -g base-index 1
set -g pane-base-index 1

# Enable mouse
set -g mouse on

# Terminal shenanigans... I don't know what these actually do.
set -s escape-time 5
set -g xterm-keys on
set -sg default-terminal "tmux-256color"
set -sa terminal-overrides ",*256col*:Tc"
set -sa terminal-features ",*:RGB:clipboard"
# Send xterm focus events to vim.
set -g focus-events on
set -g allow-passthrough on

# Cursor color hack...
%if "#{>=:#{version},3.6}"
  set -sa terminal-overrides ",*:Cr=\e]12;silver\a"
  set -g prompt-cursor-colour 'gray50'
%endif

# Increase scrollback buffer size
set -g history-limit 100000
# Messages are displayed for 4 seconds
set -g display-time 4000
# Refresh status line interval
set -g status-interval 3
set -g status-keys emacs

# Pane border appearances.
set -g pane-border-lines double
set -g pane-border-style "fg=brightblack"
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} [#{s|^$HOME|~|:pane_current_path}] "

# Vim style visual mode
set -s set-clipboard external
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X rectangle-off \; send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-on \; send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane  send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi / command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward-incremental "%%" }
bind-key -T copy-mode-vi ? command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental "%%" }
bind-key V copy-mode \; send-key V
bind-key / copy-mode \; send-key /

# Use this if OSC 52 is not supported
# set -s set-clipboard off
# if-shell "command -v xsel >/dev/null 2>&1" "set -s copy-command 'xsel -i --clipboard'" "set -s copy-command 'xclip -selection clipboard'"

# Smoother mouse scrolling
# Stop the five lines per scroll nonsense...
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X scroll-down

# Don't repeat arrow keys
bind-key Up     select-pane -U
bind-key Down   select-pane -D
bind-key Left   select-pane -L
bind-key Right  select-pane -R

# Prefix-CTRL-F launches tmux-fzf
TMUX_FZF_LAUNCH_KEY="C-f"

#
# Custom shortcuts
#
# Alt-q           jump to last pane
# Ctrl-Alt-q      jump to last window
bind-key -n M-q last-pane
bind-key -n C-M-q last-window

# Alt-[           jump to previous pane
# Alt-]           jump to next pane
# Ctrl-Alt-[      swap focused pane with previous pane
# Ctrl-Alt-]      swap focused pane with next pane
bind-key -n M-[ select-pane -t -1
bind-key -n M-] select-pane -t +1
bind-key -n C-M-[ swap-pane -U
bind-key -n C-M-] swap-pane -D

# tmux-prefix-highlight options
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_empty_prompt     '      '
set -g @prefix_highlight_prefix_prompt    ' ^A '
set -g status-left '#{prefix_highlight}[#S] '
set -g status-left-length 30
set -g status-right '#{=27:pane_title} | %a %Y-%m-%d %H:%M'
set -g status-right-length 50

# tmux-yank
# set -g @yank_action 'copy-pipe' # or 'copy-pipe-no-clear' or 'copy-pipe-and-cancel' for the default
# set -g @yank_selection_mouse 'clipboard' # or 'primary' (default) or 'secondary'

# Tmux Plugin Manager
#   $ git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# <prefix> + I to fetch plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# Keep this at the bottom
run -b '~/.tmux/plugins/tpm/tpm'
